name: uv install

on:
  pull_request:
    branches:
      - "master"
  push:
    branches:
      - "master"
  workflow_dispatch:

jobs:
  pip-install:
    runs-on: [ self-hosted, linux, x64, cpu ]
    strategy:
      fail-fast: true
      matrix:
        ubuntu: ["22.04", "24.04"]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    container:
      image: omavteam/ubuntu-omav:${{ matrix.ubuntu }}
      credentials:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    name: Ubuntu ${{ matrix.ubuntu }} | Python ${{ matrix.python-version }} | pip install
    steps:
      - name: Checkout lpp
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install lpp
        run: uv sync --python ${{ matrix.python-version }}

      - name: Run Python tests
        run: uv run --python ${{ matrix.python-version }} --with pytest pytest test/python

  glog-compatibility:
    runs-on: [ self-hosted, linux, x64, cpu ]
    strategy:
      fail-fast: false
      matrix:
        glog: ["0.4.0", "0.5.0", "0.6.0", "0.7.1"]
    container:
      image: omavteam/ubuntu-omav:22.04
      credentials:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    name: glog ${{ matrix.glog }} | Ubuntu 22.04 | Python 3.10
    env:
      CC: gcc-11
      CXX: g++-11
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      GLOG_VERSION: ${{ matrix.glog }}
    steps:
      - name: Checkout lpp
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set glog installation prefix
        run: echo "CMAKE_PREFIX_PATH=${RUNNER_TEMP}/glog-${GLOG_VERSION}" >> "$GITHUB_ENV"

      - name: Build selected glog release
        run: |
          git clone --depth 1 --branch "v${GLOG_VERSION}" \
            https://github.com/google/glog.git "${RUNNER_TEMP}/glog-source"
          cmake -S "${RUNNER_TEMP}/glog-source" -B "${RUNNER_TEMP}/glog-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_INSTALL_PREFIX="${CMAKE_PREFIX_PATH}" -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=OFF
          cmake --build "${RUNNER_TEMP}/glog-build"
          cmake --install "${RUNNER_TEMP}/glog-build"

      - name: Build lpp against selected glog
        run: |
          test -f "${CMAKE_PREFIX_PATH}/lib/cmake/glog/glog-config.cmake"
          uv sync --python 3.10 --reinstall-package lpp \
            --config-settings-package "lpp:cmake.define.glog_DIR=${CMAKE_PREFIX_PATH}/lib/cmake/glog" \
            --config-settings-package "lpp:cmake.define.LPP_BUILD_LINK_TESTS=ON" \
            --config-settings-package "lpp:build-dir=${RUNNER_TEMP}/lpp-build"

      - name: Run non-glog link regression tests
        run: ctest --test-dir "${RUNNER_TEMP}/lpp-build" --output-on-failure --no-tests=error
