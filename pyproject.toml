[build-system]
requires = ["scikit-build-core>=0.5.1", "nanobind"]
build-backend = "scikit_build_core.build"

[project]
name = "lpp"
version = "1.1.1"
description = "Log++ logging framework header-only library"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE.md" }
authors = [
  { name = "Autonomous Systems Lab, ETH Zurich", email = "git@acey.dev" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/ethz-asl/lpp"
Repository = "https://github.com/ethz-asl/lpp"

[tool.scikit-build]
cmake.source-dir = "."
wheel.packages = ["python/lpp"]

[tool.scikit-build.cmake.define]
LPP_BUILD_PYTHON_BINDINGS = "ON"

[tool.uv]
cache-keys = [
  { file = "{pyproject.toml,**/CMakeLists.txt,**/*.{C,c,cc,cpp,cxx,cu,h,hh,hpp,hxx,inl,ipp,tpp,cmake,cmake_in,in,py,cfg,json,msg,proto,pt2,service,xml,yaml,yml}}" },
]
